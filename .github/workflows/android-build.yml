name: Android USB demo
on:
  push:
    paths: ['android-demo/**', 'scripts/build-android.sh', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['android-demo/**', 'scripts/build-android.sh', '.github/workflows/android-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build and check
        run: ./scripts/build-android.sh --no-daemon
      - name: Publish test APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android-demo/README.md dist/android/Android-USB-Test.md
          cd dist/android
          sha256sum DeepMirror-Android-USB-Demo.apk > DeepMirror-Android-USB-Demo.apk.sha256
          gh release create "android-demo-${GITHUB_RUN_NUMBER}" DeepMirror-Android-USB-Demo.apk DeepMirror-Android-USB-Demo.apk.sha256 Android-USB-Test.md --target "$GITHUB_SHA" --prerelease --title "Android USB connectivity demo ${GITHUB_RUN_NUMBER}" --notes 'Development test APK. USB discovery, permission and read-only descriptor checks; RGB/depth/point-cloud capture is not implemented. Phone/camera hardware validation is required.'
